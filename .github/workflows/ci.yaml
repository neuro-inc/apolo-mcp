name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: All checks are passed
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  approve:
    name: Approve Dependabot PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for Dependabot PR
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-package:
    name: Release apolo-mcp package
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install project Python
        run: uv python install
      - name: Install dependencies
        run: make setup
      - name: Verify tag and changelog
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v$(uv run python -c 'from apolo_mcp import __version__; print(__version__)')"
          grep -F "## ${GITHUB_REF_NAME#v}" CHANGELOG.md
          test -z "$(find CHANGELOG.D -type f ! -name .gitignore -print -quit)"
      - name: Build apolo-mcp package
        run: make build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
